<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f2f2f2;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:#000}
  main{width:min(92vw,460px);background:#fff;padding:44px 36px;border-radius:6px}
  h1{margin:0;font-weight:800;font-size:clamp(56px,16vw,92px);line-height:.92;letter-spacing:-.04em}
  h1 span{display:block;margin:10px 0 24px;font-size:.62em;color:transparent;-webkit-text-stroke:2px #000}
  p{margin:0 0 20px;color:#4a4a4a;font-size:15px}
  form{display:flex;gap:10px;flex-wrap:wrap}
  input[type=password],input[type=text]{flex:1 1 200px;padding:10px 12px;border:1px solid #999;border-radius:4px;font:16px inherit}
  input:focus{outline:0;border-color:#000;box-shadow:0 0 0 3px #0002}
  button{padding:10px 20px;border:0;border-radius:4px;background:#000;color:#fff;font:500 15px inherit;cursor:pointer}
  button:hover{background:#333} button:disabled{opacity:.6;cursor:wait}
  label{flex:1 1 100%;font-size:14px;color:#4a4a4a;cursor:pointer}
  #m{flex:1 1 100%;margin:0;min-height:1.4em;font-size:14px;color:#b00020}
  form.sacude{animation:s .45s}
  @keyframes s{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  :focus-visible{outline:3px solid #1a5fff;outline-offset:2px}
